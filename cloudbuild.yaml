steps:
  # 1. Docker 이미지 빌드 (듀얼 태그: $COMMIT_SHA + latest)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-northeast3-docker.pkg.dev/miriarts/miriart-images/miriart-ai:$COMMIT_SHA'
      - '-t'
      - 'asia-northeast3-docker.pkg.dev/miriarts/miriart-images/miriart-ai:latest'
      - '.'

  # 2. Artifact Registry에 푸시 (모든 태그)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-northeast3-docker.pkg.dev/miriarts/miriart-images/miriart-ai'

  # 3. Cloud Run 배포 (내부 호출 전용 — IAM 보호)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'miriart-ai'
      - '--image=asia-northeast3-docker.pkg.dev/miriarts/miriart-images/miriart-ai:$COMMIT_SHA'
      - '--region=asia-northeast3'
      - '--platform=managed'
      - '--port=8080'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--timeout=120'
      - '--min-instances=1'
      - '--max-instances=20'
      - '--concurrency=10'
      - '--cpu-boost'
      - '--no-allow-unauthenticated'
      - '--invoker-iam-check'
      - '--service-account=miriart-ai-runner@miriarts.iam.gserviceaccount.com'
      - '--set-env-vars=GCP_PROJECT_ID=miriarts,GCP_REGION=asia-northeast3,GCS_BUCKET_NAME=miriart-bucket,GEMINI_LOCATION=global'
      - '--project=miriarts'

images:
  - 'asia-northeast3-docker.pkg.dev/miriarts/miriart-images/miriart-ai:$COMMIT_SHA'
  - 'asia-northeast3-docker.pkg.dev/miriarts/miriart-images/miriart-ai:latest'

options:
  logging: CLOUD_LOGGING_ONLY
